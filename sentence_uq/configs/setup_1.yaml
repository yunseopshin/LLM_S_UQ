# Setup 1 — Cross-domain (Han et al. reproduction).
# Train on LongFact-Objects, validate on held-out LongFact topics,
# test on the fixed Han 30-entity FActScore-Bio set.
# Inherits everything else (model, generation, training, logit_reg_lambda, ...)
# from configs/default.yaml via the load_config `inherits` mechanism.
inherits: default.yaml

dataset:
  setup: 1
  split_file: data/splits/setup_1.json

results_dir: results/setup_1
